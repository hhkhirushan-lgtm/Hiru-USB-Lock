name: Build HIRU USB LOCK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name "Hiru USB Lock" hiru_lock.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Hiru-USB-Lock-Windows
          path: "dist/Hiru USB Lock.exe"
